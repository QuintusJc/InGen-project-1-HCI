<!doctype html>
<html lang="en" id="top">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ari Control Center — Human-Centered Motion Dashboard</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header neu-surface sticky">
    <nav class="nav container">
      <a class="brand" href="index.html">Ari</a>
      <input id="navToggle" type="checkbox" class="nav-toggle" aria-label="Open menu">
      <label class="hamburger" for="navToggle"><span></span></label>
      <ul class="nav-links">
        <li><a href="index.html#concept">Concept</a></li>
        <li><a href="storyboard.html">Motion Page</a></li>
        <li><a class="active" href="control.html">Control UI</a></li>
      </ul>
    </nav>
  </header>

  <main class="container control-wrap">
    <section class="tablet neu-surface">
      <header class="tablet-header">
        <h1>Ari Control Center</h1>
        <p class="sub">Human-Centered Motion Dashboard</p>
        <span class="pill" aria-hidden="true"></span>
      </header>

      <div class="block">
        <button class="btn btn-primary btn-pulse">Start Interaction</button>
        <div class="btn-row">
          <button class="btn btn-ghost btn-pulse">Pause</button>
          <button class="btn btn-ghost btn-pulse">Follow Me</button>
        </div>
        <button class="btn btn-ghost">Return to Base</button>
      </div>

      <div class="block">
        <h2 class="block-title">Motion Feedback</h2>
        <div class="indicator-line neu-elev">
          <div class="phase-indicator small">
            <div class="dot"></div>
          </div>
          <span class="muted">Anticipate • Move • Rest</span>
        </div>
      </div>

      <div class="block">
        <h2 class="block-title">Safety & Awareness</h2>

        <!-- Toggle switches with pressed-in ON state -->
        <label class="toggle neu-elev">
          <input type="checkbox" checked>
          <span class="track"><span class="knob"></span></span>
          <span class="label">Obstacle Avoidance</span>
        </label>

        <label class="toggle neu-elev">
          <input type="checkbox" checked>
          <span class="track"><span class="knob"></span></span>
          <span class="label">Safe Distance</span>
        </label>

        <label class="toggle neu-elev">
          <input type="checkbox">
          <span class="track"><span class="knob"></span></span>
          <span class="label">Manual Override</span>
        </label>
      </div>

      <footer class="tablet-footer">
        <p class="status">Ari is waiting for your signal.</p>
      </footer>
    </section>
  </main>

  <a href="#top" class="to-top" aria-label="Back to top">↑</a>
  <footer class="site-footer container">
    <p class="small muted">© 2025 Ari Project</p>
  </footer>
</body>
</html>
